[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "witnesscreator"
dynamic = ["version"]
description = "SV-COMP violation witnesses for Java: YAML format 2.3 and legacy GraphML"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Nils Loose" }]
keywords = ["sv-comp", "witness", "java", "verification"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7", "PyYAML>=6"]

[project.scripts]
witnesscreator = "witnesscreator.cli:main"

[project.urls]
Homepage = "https://github.com/SWAT-project/WitnessCreator"
Issues = "https://github.com/SWAT-project/WitnessCreator/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "witnesscreator._version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
