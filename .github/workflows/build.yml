name: Build WitnessCreator

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[test]'

      - name: Install WitnessLint
        run: |
          git clone --depth 1 https://gitlab.com/sosy-lab/benchmarking/sv-witnesses.git "$RUNNER_TEMP/sv-witnesses"
          python -m pip install -r "$RUNNER_TEMP/sv-witnesses/linter/requirements.txt"
          echo "WITNESSLINT=python $RUNNER_TEMP/sv-witnesses/linter/witnesslinter.py" >> "$GITHUB_ENV"

      - name: Test (unit, golden, WitnessLint on generated witnesses)
        run: python -m pytest -v -rs

      - name: Smoke-test the command line
        run: |
          witnesscreator --version
          python -m witnesscreator --help > /dev/null

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Build wheel, sdist and zipapp
        run: |
          python -m pip install --upgrade pip build
          python -m build
          python tools/build_pyz.py dist/witnesscreator.pyz
          python dist/witnesscreator.pyz --version
          python -m pip install dist/witnesscreator-*.whl
          witnesscreator --version
          cd dist && sha256sum witnesscreator-* > SHA256SUMS && cat SHA256SUMS

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: witnesscreator-${{ github.sha }}
          path: |
            dist/witnesscreator-*.whl
            dist/witnesscreator-*.tar.gz
            dist/witnesscreator.pyz
            dist/SHA256SUMS
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download CI artifact
        uses: actions/download-artifact@v4
        with:
          name: witnesscreator-${{ github.sha }}
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          notes="$(printf 'Automated WitnessCreator release.\n\nInstall: pip install git+https://github.com/%s@%s\n\nCommit: %s\nRun: %s/%s/actions/runs/%s\n' \
            "$GITHUB_REPOSITORY" "$tag" "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          files=(dist/witnesscreator-*.whl dist/witnesscreator-*.tar.gz dist/witnesscreator.pyz dist/SHA256SUMS)

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" \
              --verify-tag \
              --title "WitnessCreator ${tag}" \
              --notes "$notes"
          fi
